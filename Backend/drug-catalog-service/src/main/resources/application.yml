server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: drug-catalog-service
  config:
    # Le Config Server est optionnel au démarrage (le service démarre même s'il est absent)
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3308/pharmap_drugcatalog?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USER:pharmap}
    password: ${DB_PASSWORD:pharmap}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
