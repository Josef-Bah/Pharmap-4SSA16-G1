# Configuration de test : aucune infrastructure externe requise (H2 en mémoire)
spring:
  application:
    name: drug-catalog-service
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:drugcatalog;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
eureka:
  client:
    enabled: false
